name: otel-basic
fixture:
  compose:
    file: docker-compose.yaml
    app_service: app
    app_port: 8080
seed:
  type: app
input:
  - path: /run
expected:
  traces:
    - traceql: '{ resource.service.name = "mise-oats" && name = "mise run hello" }'
      match_spans:
        - name: mise run hello
          attributes:
            - key: mise.span_type
              value: run
    - traceql: '{ resource.service.name = "mise-oats" && name = "hello" }'
      match_spans:
        - name: hello
          attributes:
            - key: mise.task.name
              value: hello
  logs:
    - logql: '{service_name="mise-oats"} |= `hello from oats task`'
      match:
        - name: hello from oats task
      # Each assertion poll can drive the input again, producing duplicate logs.
      count: ">= 1"
